<svg width="860" height="340" viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9C"/>
      <stop offset="100%" stop-color="#3ECF8E"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="856" height="336" rx="10" fill="url(#bgGrad)" stroke="#00FF9C" stroke-width="1.5" filter="url(#glowFilter)"/>
  <rect x="2" y="2" width="856" height="336" rx="10" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- Top Title Tag -->
  <rect x="24" y="-1" width="360" height="24" rx="4" fill="#0d1117" stroke="#00FF9C" stroke-width="1.2"/>
  <text x="36" y="15" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="bold" fill="#00FF9C" letter-spacing="1">🎮 COGNITIVE GAME AGENT LAB // HUD</text>

  <!-- Left Column: Class & NPC Dialogue -->
  <g transform="translate(30, 42)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">⚔️ CLASS: Autonomous Agent Architect &amp; Game AI</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Building living worlds with on-device generative NPCs &amp; episodic memory</text>

    <!-- Dialogue Box -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="460" height="92" rx="6" fill="#161f2c" stroke="#388bfd" stroke-width="1"/>
      <text x="14" y="22" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#58a6ff">🤖 NPC Agent (llama.cpp + ChromaDB Episodic Memory):</text>
      <text x="14" y="44" font-family="'Fira Code', monospace" font-size="11" fill="#7ee787">"I perceived your arrival. Retrieving past events</text>
      <text x="14" y="62" font-family="'Fira Code', monospace" font-size="11" fill="#7ee787">from vector memory... Synthesizing quest tree</text>
      <text x="14" y="80" font-family="'Fira Code', monospace" font-size="11" fill="#00FF9C" font-weight="bold">100% on bare metal."</text>
    </g>
  </g>

  <!-- Right Column: System Capabilities -->
  <g transform="translate(530, 42)">
    <text x="0" y="16" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" fill="#00FF9C">📊 ENGINE STATS</text>

    <!-- Stat 1 -->
    <g transform="translate(0, 30)">
      <text x="0" y="10" font-family="'Fira Code', monospace" font-size="11" fill="#c9d1d9">Generative NPC Swarms</text>
      <rect x="180" y="0" width="110" height="12" rx="3" fill="#21262d"/>
      <rect x="180" y="0" width="105" height="12" rx="3" fill="url(#neonGlow)"/>
    </g>
    <!-- Stat 2 -->
    <g transform="translate(0, 56)">
      <text x="0" y="10" font-family="'Fira Code', monospace" font-size="11" fill="#c9d1d9">Episodic Vector Memory</text>
      <rect x="180" y="0" width="110" height="12" rx="3" fill="#21262d"/>
      <rect x="180" y="0" width="100" height="12" rx="3" fill="url(#neonGlow)"/>
    </g>
    <!-- Stat 3 -->
    <g transform="translate(0, 82)">
      <text x="0" y="10" font-family="'Fira Code', monospace" font-size="11" fill="#c9d1d9">Local GGUF Quantization</text>
      <rect x="180" y="0" width="110" height="12" rx="3" fill="#21262d"/>
      <rect x="180" y="0" width="102" height="12" rx="3" fill="url(#neonGlow)"/>
    </g>
    <!-- Stat 4 -->
    <g transform="translate(0, 108)">
      <text x="0" y="10" font-family="'Fira Code', monospace" font-size="11" fill="#c9d1d9">Phaser 3 / 3D Space</text>
      <rect x="180" y="0" width="110" height="12" rx="3" fill="#21262d"/>
      <rect x="180" y="0" width="94" height="12" rx="3" fill="url(#neonGlow)"/>
    </g>
    <!-- Stat 5 -->
    <g transform="translate(0, 134)">
      <text x="0" y="10" font-family="'Fira Code', monospace" font-size="11" fill="#c9d1d9">Zero-Cloud Latency</text>
      <rect x="180" y="0" width="110" height="12" rx="3" fill="#21262d"/>
      <rect x="180" y="0" width="110" height="12" rx="3" fill="url(#neonGlow)"/>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="30" y1="216" x2="830" y2="216" stroke="#21262d" stroke-width="1"/>

  <!-- Cognitive Architecture Pipeline Flow -->
  <g transform="translate(30, 230)">
    <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#00FF9C">🧠 LOCAL COGNITIVE PIPELINE (Park et al. Architecture on Bare-Metal)</text>

    <!-- Node 1: World & Perception -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="170" height="54" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
      <text x="85" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f0f6fc" text-anchor="middle">🎮 2D World (Phaser 3)</text>
      <text x="85" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Perception &amp; Spatial Events</text>
    </g>

    <!-- Arrow 1 -->
    <line x1="175" y1="51" x2="205" y2="51" stroke="#00FF9C" stroke-width="1.5" stroke-dasharray="3"/>

    <!-- Node 2: Memory -->
    <g transform="translate(210, 24)">
      <rect x="0" y="0" width="180" height="54" rx="6" fill="#161b22" stroke="#00FF9C" stroke-width="1.2"/>
      <text x="90" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#00FF9C" text-anchor="middle">🧠 Episodic Memory</text>
      <text x="90" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">ChromaDB Vector Retrieval</text>
    </g>

    <!-- Arrow 2 -->
    <line x1="395" y1="51" x2="425" y2="51" stroke="#00FF9C" stroke-width="1.5"/>

    <!-- Node 3: Local Brain -->
    <g transform="translate(430, 24)">
      <rect x="0" y="0" width="180" height="54" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="90" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#58a6ff" text-anchor="middle">⚡ On-Device Brain</text>
      <text x="90" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">llama.cpp / DistilBERT Intent</text>
    </g>

    <!-- Arrow 3 -->
    <line x1="615" y1="51" x2="645" y2="51" stroke="#00FF9C" stroke-width="1.5"/>

    <!-- Node 4: Action -->
    <g transform="translate(650, 24)">
      <rect x="0" y="0" width="150" height="54" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1.2"/>
      <text x="75" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#bc8cff" text-anchor="middle">⚔️ Goal Execution</text>
      <text x="75" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Procedural Quest Trigger</text>
    </g>
  </g>
</svg>
