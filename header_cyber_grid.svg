<svg width="100%" height="100%" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Neon Cyan Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Perspective Grid Pattern -->
    <linearGradient id="gridFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Base Plate -->
  <rect width="900" height="250" rx="12" fill="url(#bgGrad)"/>
  <rect width="900" height="250" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Perspective Cyber Floor Grid -->
  <g opacity="0.75">
    <!-- Horizontal Perspective Lines -->
    <line x1="0" y1="248" x2="900" y2="248" stroke="url(#gridFade)" stroke-width="1.5"/>
    <line x1="20" y1="230" x2="880" y2="230" stroke="url(#gridFade)" stroke-width="1.2"/>
    <line x1="60" y1="214" x2="840" y2="214" stroke="url(#gridFade)" stroke-width="1.0"/>
    <line x1="120" y1="200" x2="780" y2="200" stroke="url(#gridFade)" stroke-width="0.8"/>
    <line x1="200" y1="188" x2="700" y2="188" stroke="url(#gridFade)" stroke-width="0.6"/>
    <line x1="300" y1="178" x2="600" y2="178" stroke="url(#gridFade)" stroke-width="0.4"/>

    <!-- Vanishing Perspective Lines -->
    <line x1="450" y1="170" x2="-100" y2="250" stroke="url(#gridFade)" stroke-width="1"/>
    <line x1="450" y1="170" x2="80" y2="250" stroke="url(#gridFade)" stroke-width="1"/>
    <line x1="450" y1="170" x2="240" y2="250" stroke="url(#gridFade)" stroke-width="1"/>
    <line x1="450" y1="170" x2="380" y2="250" stroke="url(#gridFade)" stroke-width="1"/>
    <line x1="450" y1="170" x2="520" y2="250" stroke="url(#gridFade)" stroke-width="1"/>
    <line x1="450" y1="170" x2="660" y2="250" stroke="url(#gridFade)" stroke-width="1"/>
    <line x1="450" y1="170" x2="820" y2="250" stroke="url(#gridFade)" stroke-width="1"/>
    <line x1="450" y1="170" x2="1000" y2="250" stroke="url(#gridFade)" stroke-width="1"/>
  </g>

  <!-- Left: Cyber Matrix Nodes & Constellations -->
  <g opacity="0.6">
    <circle cx="60" cy="50" r="3" fill="#38bdf8"/>
    <circle cx="110" cy="30" r="2.5" fill="#0ea5e9"/>
    <circle cx="140" cy="80" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="80" cy="110" r="2.5" fill="#0284c7"/>
    <line x1="60" y1="50" x2="110" y2="30" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="3,3"/>
    <line x1="110" y1="30" x2="140" y2="80" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="3,3"/>
    <line x1="60" y1="50" x2="80" y2="110" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="3,3"/>
    <line x1="80" y1="110" x2="140" y2="80" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="3,3"/>
  </g>

  <!-- Right: 3D Geodesic Neural Sphere Structure -->
  <g transform="translate(730, 115)">
    <!-- Outer Glow Ambient -->
    <circle cx="0" cy="0" r="68" fill="#38bdf8" opacity="0.08" filter="url(#glow-intense)"/>

    <!-- Wireframe Latitude/Longitude Rings -->
    <ellipse cx="0" cy="0" rx="60" ry="60" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="60" ry="24" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="60" ry="46" fill="none" stroke="#0284c7" stroke-width="0.8" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="24" ry="60" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="46" ry="60" fill="none" stroke="#0284c7" stroke-width="0.8" opacity="0.6"/>

    <!-- Internal Polyhedral Nodes -->
    <polygon points="0,-60 42,-22 26,48 -26,48 -42,-22" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.75"/>
    <polygon points="0,60 42,22 26,-48 -26,-48 -42,22" fill="none" stroke="#7dd3fc" stroke-width="0.8" opacity="0.65"/>
    <line x1="-42" y1="-22" x2="42" y2="22" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>
    <line x1="42" y1="-22" x2="-42" y2="22" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#7dd3fc" stroke-width="1" opacity="0.6"/>

    <!-- Glowing Active Core & Vertices -->
    <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#glow-intense)"/>
    <circle cx="0" cy="-60" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="0" cy="60" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="42" cy="-22" r="3.5" fill="#7dd3fc" filter="url(#glow)"/>
    <circle cx="-42" cy="-22" r="3.5" fill="#7dd3fc" filter="url(#glow)"/>
    <circle cx="26" cy="48" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="-26" cy="48" r="3.5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="60" cy="0" r="3" fill="#0ea5e9"/>
    <circle cx="-60" cy="0" r="3" fill="#0ea5e9"/>
  </g>

  <!-- Center-Left Typography & Branding -->
  <g transform="translate(60, 0)">
    <!-- Subtitle Pill -->
    <rect x="0" y="44" width="220" height="24" rx="12" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <circle cx="12" cy="56" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <text x="24" y="60" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="1.5">EDGE NEURAL CORE</text>

    <!-- Main Title -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="5">TARUN R</text>

    <!-- Primary Descriptor -->
    <text x="0" y="146" font-family="'Fira Code', monospace" font-size="14.5" font-weight="600" fill="#38bdf8" letter-spacing="1.5">EDGE AI <tspan fill="#64748b">&#8226;</tspan> AUTONOMOUS AGENTS <tspan fill="#64748b">&#8226;</tspan> GAME SYSTEMS</text>

    <!-- Mission Motto -->
    <text x="0" y="176" font-family="'Fira Code', monospace" font-size="12" fill="#94a3b8" letter-spacing="0.5">&gt; "I don't rent compute. I own it."</text>
  </g>

  <!-- Bottom Accent Highlight Bar -->
  <line x1="0" y1="249" x2="900" y2="249" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
</svg>
